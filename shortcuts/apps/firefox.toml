schema_version = 1

[app]
id            = "firefox"
executables   = ["firefox", "firefox-esr", "firefox-bin", "firefox.exe"]
title_pattern = ""

[[shortcuts]]
menu_path   = ["File", "New Tab"]
keys        = [{ linux = "Ctrl+T", windows = "Ctrl+T", macos = "⌘T" }]
description = "Open a new tab"
category    = "navigation"

[[shortcuts]]
menu_path   = ["File", "New Window"]
keys        = [{ linux = "Ctrl+N", windows = "Ctrl+N", macos = "⌘N" }]
description = "Open a new browser window"
category    = "navigation"

[[shortcuts]]
menu_path   = ["File", "New Private Window"]
keys        = [{ linux = "Ctrl+Shift+P", windows = "Ctrl+Shift+P", macos = "⌘⇧P" }]
description = "Open a new private browsing window"
category    = "navigation"

[[shortcuts]]
menu_path   = ["File", "Open File"]
keys        = [{ linux = "Ctrl+O", windows = "Ctrl+O", macos = "⌘O" }]
description = "Open a local file in the browser"
category    = "file"

[[shortcuts]]
menu_path   = ["File", "Close Tab"]
keys        = [{ linux = "Ctrl+W", windows = "Ctrl+W", macos = "⌘W" }]
description = "Close the current tab"
category    = "navigation"

[[shortcuts]]
menu_path   = ["File", "Save Page As"]
keys        = [{ linux = "Ctrl+S", windows = "Ctrl+S", macos = "⌘S" }]
description = "Save the current page to disk"
category    = "file"

[[shortcuts]]
menu_path   = ["File", "Print"]
keys        = [{ linux = "Ctrl+P", windows = "Ctrl+P", macos = "⌘P" }]
description = "Print the current page"
category    = "file"

[[shortcuts]]
menu_path   = ["Edit", "Find"]
keys        = [{ linux = "Ctrl+F", windows = "Ctrl+F", macos = "⌘F" }]
description = "Find text on the page"
category    = "editing"

[[shortcuts]]
menu_path   = ["Edit", "Find Again"]
keys        = [{ linux = "Ctrl+G", windows = "Ctrl+G", macos = "⌘G" }]
description = "Find next match"
category    = "editing"

[[shortcuts]]
menu_path   = ["View", "Reload"]
keys        = [{ linux = "Ctrl+R", windows = "Ctrl+R", macos = "⌘R" }]
description = "Reload the current page"
category    = "navigation"

[[shortcuts]]
menu_path   = ["View", "Full Screen"]
keys        = [{ linux = "F11", windows = "F11", macos = "F11" }]
description = "Toggle full screen mode"
category    = "view"

[[shortcuts]]
menu_path   = ["View", "Zoom", "Zoom In"]
keys        = [{ linux = "Ctrl++", windows = "Ctrl++", macos = "⌘+" }]
description = "Zoom in"
category    = "view"

[[shortcuts]]
menu_path   = ["View", "Zoom", "Zoom Out"]
keys        = [{ linux = "Ctrl+-", windows = "Ctrl+-", macos = "⌘-" }]
description = "Zoom out"
category    = "view"

[[shortcuts]]
menu_path   = ["View", "Zoom", "Reset Zoom"]
keys        = [{ linux = "Ctrl+0", windows = "Ctrl+0", macos = "⌘0" }]
description = "Reset zoom to 100%"
category    = "view"

[[shortcuts]]
menu_path   = ["History", "Back"]
keys        = [{ linux = "Alt+Left", windows = "Alt+Left", macos = "⌘[" }]
description = "Navigate back"
category    = "navigation"

[[shortcuts]]
menu_path   = ["History", "Forward"]
keys        = [{ linux = "Alt+Right", windows = "Alt+Right", macos = "⌘]" }]
description = "Navigate forward"
category    = "navigation"

[[shortcuts]]
menu_path   = ["Bookmarks", "Bookmark This Page"]
keys        = [{ linux = "Ctrl+D", windows = "Ctrl+D", macos = "⌘D" }]
description = "Bookmark the current page"
category    = "navigation"

[[shortcuts]]
menu_path   = ["Bookmarks", "Show All Bookmarks"]
keys        = [{ linux = "Ctrl+Shift+B", windows = "Ctrl+Shift+B", macos = "⌘⇧B" }]
description = "Open the bookmarks library"
category    = "navigation"

[[shortcuts]]
menu_path   = ["Tools", "Downloads"]
keys        = [{ linux = "Ctrl+Shift+Y", windows = "Ctrl+J", macos = "⌘⇧Y" }]
description = "Show the downloads panel"
category    = "tools"

[[shortcuts]]
menu_path   = ["Tools", "Developer Tools"]
keys        = [{ linux = "F12", windows = "F12", macos = "F12" }]
description = "Open developer tools"
category    = "tools"

[[shortcuts]]
menu_path   = ["Tools", "Browser Console"]
keys        = [{ linux = "Ctrl+Shift+J", windows = "Ctrl+Shift+J", macos = "⌘⇧J" }]
description = "Open the browser console"
category    = "tools"

[[semantic_actions]]
role        = "tab"
context     = "tab-not-selected"
keys        = [{ linux = "Ctrl+Tab", windows = "Ctrl+Tab", macos = "⌃Tab" }]
description = "Switch to next/previous tab"
category    = "navigation"
